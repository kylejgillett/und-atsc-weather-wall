<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UND Leon F. Osborne Weather Wall</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
        }

        body {
            display: flex;
            flex-direction: column;

            border: 6px solid #009A44;
            box-sizing: border-box;

            overflow: hidden;
        }

        header {
            height: 75px;
            flex-shrink: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: #2A2B28;
            color: white;

            font-family: Arial, sans-serif;
        }
        .header-title {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.2;
            text-align: center;
        }
        .header-clock {
            width: 210px;
            height: 20px;

            margin-top: 4px;
            border: 0;
        }


        .weather-wall {
            flex: 1;

            display: flex;
            align-items: stretch;
            justify-content: center;

            width: 78%;
            margin: 0 auto;

            min-height: 0;
        }
        .weather-wall iframe {
            width: 33.3333%;
            height: 100%;

            margin: 0;
            padding: 0;
            border: none;

            display: block;
        }




        footer {
            height: 24px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #4d4d4d;
            background: #111;

            font-size: 11px;
            font-family: Arial, sans-serif;
            text-align: center;
        }




        @media (max-width: 700px) {

            html,
            body {
                height: auto;
                min-height: 100%;
            }
            body {
                min-height: 100vh;
                overflow-y: auto;
            }
            header {
                height: auto;
                min-height: 70px;
                padding: 8px 6px;
            }
            .header-title {
                font-size: 14px;
            }
            .header-clock {
                width: 207px;
                height: 18px;
                margin-top: 5px;
            }
            .weather-wall {
                flex: none;

                width: 100%;
                margin: 0;

                display: flex;
                flex-direction: column;
            }
            .weather-wall iframe {
                width: 100%;
                height: 60vh;
                min-height: 350px;

                flex-shrink: 0;
            }
            footer {
                height: auto;
                min-height: 24px;

                padding: 4px 8px;

                font-size: 9px;
            }
        }

    </style>
</head>





<body>

    <header>

        <div class="header-title">
            UND Atmospheric Sciences • Leon F. Osborne Weather Wall
        </div>

        <iframe
            class="header-clock"
            src="https://free.timeanddate.com/clock/ialqg4dl/fn15/fcbbb/tct/pct/ftb/tt0/tw1/tm1/td2/th1/ta1/tb1"
            title="Current Time"
            frameborder="0"
            width="207"
            height="18"
            allowtransparency="true">
        </iframe>

    </header>


    <main class="weather-wall">
        <iframe
            src="https://digital-signage.aero.und.edu/atmospheric-sciences/weather-wall/left"
            title="Weather Wall Left">
        </iframe>
        <iframe
            src="https://digital-signage.aero.und.edu/atmospheric-sciences/weather-wall/middle"
            title="Weather Wall Middle">
        </iframe>
        <iframe
            src="https://digital-signage.aero.und.edu/atmospheric-sciences/weather-wall/right"
            title="Weather Wall Right">
        </iframe>
    </main>

    <footer>
        (C) UND Atmospheric Sciences 2026 • Direct questions or comments to kyle.gillett@und.edu
    </footer>

</body>

</html>
